name: Build cabinet update
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build update archive
        run: |
          tar --exclude='.git' --exclude='ssh' --exclude='**/build' -czf "$RUNNER_TEMP/dreadwire-arcade-update.tar.gz" .
          mv "$RUNNER_TEMP/dreadwire-arcade-update.tar.gz" .
          sha256sum dreadwire-arcade-update.tar.gz > dreadwire-arcade-update.tar.gz.sha256
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dreadwire-arcade-update.tar.gz
            dreadwire-arcade-update.tar.gz.sha256
