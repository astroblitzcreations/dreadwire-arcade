# Settings made here will only override settings in the global retroarch.cfg if placed above the #include line

input_remapping_directory = "/opt/retropie/configs/dreamcast"

# Feed the cabinet's rotated digital axes to Flycast's left analog stick.
input_player1_l_x_minus_axis = "+1"
input_player1_l_x_plus_axis = "-1"
input_player1_l_y_minus_axis = "-0"
input_player1_l_y_plus_axis = "+0"

# The cabinet LCD is physically mounted in portrait and RetroArch rotates the
# output.  Use the full video surface instead of Flycast's core aspect box.
aspect_ratio_index = "24"
video_aspect_ratio_auto = "false"
video_force_aspect = "false"
video_scale_integer = "false"

# Send game audio straight to the cabinet's HDMI output.  Volume is inherited
# from the global config so the cabinet shortcut can save one master level.
audio_driver = "alsa"
audio_device = "hdmi:CARD=vc4hdmi0,DEV=0"
audio_enable = "true"

#include "/opt/retropie/configs/all/retroarch.cfg"
